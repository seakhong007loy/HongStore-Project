{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page | HongStore Backend </title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <link rel="icon" href="{% static 'image/BigHongStore.png' %}">
    <!-- FontAweSome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>
<body>
    <section class="w-full h-screen flex justify-center items-center">
        <div class="w-90 h-auto animate-elementUp bg-gray-50 shadow-2xl rounded-lg p-10 pb-3 flex justify-center items-center flex-col transition duration-300 hover:scale-105">
            <h1 class="font-bold text-2xl mb-5 transition duration-300 hover:text-blue-500 cursor-pointer">
                REGISTER ACCOUNT
            </h1>

            <form action="" method="post"
                class="flex justify-center items-center flex-col">
                {% csrf_token %}
                <!-- Input Box -->
                <div class="flex justify-center items-center flex-col">
                    <div class="">
                        <i class="fa-solid fa-user"></i>
                            <div class="p-2 border border-gray-200 rounded-lg transition duration-300 hover:border-blue-500">
                                {{form.username}}
                            </div>
                    </div>
                    
                    <div class="">
                        <i class="fa-regular fa-envelope"></i>
                            <div class="p-2 border border-gray-200 rounded-lg transition duration-300 hover:border-blue-500">
                                {{form.email}}
                            </div>
                    </div>
                    
                    <div class="">
                        <i class="fa-solid fa-key"></i>
                            <div class="p-2 border border-gray-200 rounded-lg transition duration-300 hover:border-blue-500">
                                {{form.password1}}
                            </div>
                    </div>
                    
                    <div class="">
                        <i class="fa-solid fa-key"></i>
                            <div class="p-2 border border-gray-200 rounded-lg transition duration-300 hover:border-blue-500">
                                {{form.password2}}
                            </div>
                    </div>
                    
                </div>
                <input class="bg-blue-400 w-40 p-2 mt-4 rounded-lg text-white transition duration-300 hover:bg-blue-500 hover:scale-105 cursor-pointer"
                    type="submit" value="Register Account">
            </form>
            <p class="text-red-500">{{form.errors}}</p>
            <div class="flex gap-3 mt-4">
                <p>
                    Don't have an account? 
                </p>
                <a href="/HongStore_backend/login_page" class="text-blue-500 transition duration-300 hover:text-blue-400 hover:scale-105 ">
                    Sign In
                </a>
            </div>
        </div>
    </section>
</body>
</html>
