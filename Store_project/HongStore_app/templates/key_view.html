{% load static %}

{% block content %}
<title>Detail Keyboard | HongStore</title>
<link rel="stylesheet" href="{% static 'css/output.css' %}" />
    <link rel="icon" href="{% static 'image/BigHongStore.png' %}">
<!-- FontAweSome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
  
<div
  class="w-full h-screen flex flex-col md:flex-row justify-center items-center"
>
<a href="/keyboard" class="absolute top-0 left-0 text-3xl p-2 m-2 transition duration-300 hover:scale-105 hover:text-red-500">
  <i class="fa-solid fa-circle-arrow-left"></i>
</a>

  <div class="md:w-[50%] animate-imageComeIn">
    <img
      class="w-[80%] h-[80%] object-contain md:hover:scale-105 transition duration-300"
      src="/media/{{kv.photo_first}}"
      alt="{{kv.name}}"
    />
  </div>

  <div class="md:w-[50%] animate-textComeIn">
    <h1
      class="text-2xl font-bold hover:text-blue-600 cursor-default transition duration-500"
    >
      {{kv.name}}
    </h1>
    <br />
    <h1 class="text-lg flex gap-3">
      Price:
      <p
        class="hover:text-yellow-400 cursor-default transition duration-500 hover:scale-105"
      >
        <b>${{kv.price}}</b>
      </p>
    </h1>
    <br>
    <!-- Color -->
    <div class="flex gap-3">
        <a class="w-20 h-20 bg-black border border-gray-300" href="#"></a>
        <a class="w-20 h-20 bg-white border border-gray-300" href="#"></a>
    </div>
    <br />
    <p>Description:</p>
    <p
      class="hover:text-orange-400 cursor-default transition duration-500 px-10"
    >
      {{kv.detail}}
    </p>
    <br>
    <a class="bg-blue-600 hover:bg-blue-400 text-white p-2 rounded-lg transition duration-500"
      href="/order_keyboard/{{kv.id}}">
      <i class="fa-solid fa-cart-shopping"></i> Order Now
    </a>
  </div>
</div>
{% endblock content %}
