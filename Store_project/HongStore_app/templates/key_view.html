{% extends 'layout.html' %}

{% block title %}
Detail Laptop | HongStore
{% endblock title %}

{% block content %}
  
<div
  class="w-full h-auto flex flex-col md:flex-row justify-center items-center"
>
<a href="/keyboard" class="top-12 left-0 fixed text-3xl p-2 m-2 transition duration-300 hover:scale-105 hover:text-red-500">
  <i class="fa-solid fa-circle-arrow-left"></i>
</a>

  
<div class="max-w-xl mx-auto md:w-[50%] animate-imageComeIn">

    <!-- Main Image -->
    <div class="w-full h-96 overflow-hidden transition duration-300 hover:scale-105 cursor-none">
        <img id="mainImage"
             src="/media/{{kv.photo_second}}"
             class="w-full h-full object-contain transition-all duration-300">
    </div>

    <!-- Thumbnail Images -->
    <div class="flex gap-3 overflow-x-auto scrollbar-hide scroll-smooth mt-4">
        <img onclick="changeImage(this)"
             src="/media/{{kv.photo_second}}"
             class="w-24 h-24 shrink-0 object-cover rounded-lg border-2 border-blue-500 cursor-pointer">

        <img onclick="changeImage(this)"
             src="/media/{{kv.photo_first}}"
             class="w-24 h-24 shrink-0 object-cover rounded-lg border-2 border-transparent cursor-pointer">
    </div>

</div>

  <div class="md:w-[50%] animate-textComeIn">
    <h1
      class="text-2xl font-bold hover:text-blue-600 cursor-default transition duration-500"
    >
      {{kv.name}}
    </h1>
    <br />
    <h1 class="text-lg flex gap-3">
      Price:
      <p
        class="hover:text-yellow-400 cursor-default transition duration-500 hover:scale-105"
      >
        <b>${{kv.price}}</b>
      </p>
    </h1>
    <br>
    <!-- Color -->
    <div class="flex gap-3">
        <a class="w-20 h-20 bg-black border border-gray-300" href="#"></a>
        <a class="w-20 h-20 bg-white border border-gray-300" href="#"></a>
    </div>
    <br />
    <p>Description:</p>
    <p
      class="hover:text-orange-400 cursor-default transition duration-500 px-10"
    >
      {{kv.detail}}
    </p>
    <br>
    <a class="bg-blue-600 hover:bg-blue-400 text-white p-2 rounded-lg transition duration-500"
      href="/order_keyboard/{{kv.id}}">
      <i class="fa-solid fa-cart-shopping"></i> Order Now
    </a>
  </div>
</div>

<script>
function changeImage(element) {

    // Get Main Image
    const mainImage = document.getElementById('mainImage');

    // Change Image
    mainImage.src = element.src;

    // Remove active border from all images
    document.querySelectorAll('.overflow-x-auto img').forEach(img => {
        img.classList.remove('border-blue-500');
        img.classList.add('border-transparent');
    });

    // Add active border to clicked image
    element.classList.remove('border-transparent');
    element.classList.add('border-blue-500');

}
</script>
{% endblock content %}
