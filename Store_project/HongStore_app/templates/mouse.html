{% extends 'layout.html' %}
{% block title %}
Mouse | HongStore
{% endblock title %}

{% block content %}

<!-- Product Container -->
<div class="mt-15 px-4 sm:px-6 lg:px-10">

  <!-- Product Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 animate-elementUp">
    
    {% for m in mouse %}
        
        <!-- Product Cart -->
        <div class=" border border-red-500 rounded-lg overflow-hidden">

            <!-- Image -->
             <div class="w-full h-auto flex justify-center items-center">
                <a href="/mouse_view/{{ m.id }}" class="w-full h-full flex justify-center items-center">
                    <img 
                        src="/media/{{ m.photo_first }}"
                        alt="{{ m.name }}"
                        class="w-full h-full
                            hover:scale-105 transition duration-300"
                    />
                </a>
            </div>

            <!-- TExt -->
            <div class="p-4 h-full shadow-lg">

                <!-- Product Name -->
                <p class="font-semibold text-lg truncate">
                {{ m.name }}
                </p>

                <!-- Price + Discount -->
                <div class="mt-2 flex justify-between items-center">

                <p class="text-xl font-bold">
                    ${{ m.price }}
                </p>

                {% if m.discount %}
                <span class="text-sm text-red-500 font-semibold">
                    -{{ m.discount }}%
                </span>
                {% endif %}

                </div>

            </div>

        </div>

    {% endfor %}
        
  </div>

</div>

{% endblock content %}
